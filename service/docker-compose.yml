services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mars_forecast_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_BUCKET_NAME=mars-forecasting
      - DATABASE_URL=postgresql+psycopg2://mars_user:mars_password@postgres:5432/mars_forecasting
    volumes:
      - ./data:/app/data
    depends_on:
      - mlflow
      - minio

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: mars_forecast_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: mars_mlflow
    ports:
      - "5050:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      - minio
    command:
      - bash
      - -c
      - |
        pip install boto3 --quiet
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:////mlruns/mlflow.db \
          --default-artifact-root s3://mars-forecasting/mlflow \
          --serve-artifacts
  minio:
    image: minio/minio
    container_name: mars_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
  training:
    build:
      context: .
      dockerfile: Dockerfile.training
    container_name: mars_training
    environment:
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_BUCKET_NAME=mars-forecasting

      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - minio
      - mlflow

volumes:
  minio_data: